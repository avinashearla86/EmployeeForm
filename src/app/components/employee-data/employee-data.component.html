<div class="container mt-4">
    <h2 class="mb-4">Employee Management</h2>
    <div class="col-12"></div>
    <button class="btn btn-primary" (click)="openModel()">Add Employee</button>
    
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                 <th>Email</th>
                <th>Contact</th>
                <th>City</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="employeeTable">
            @for (item of employeeList; track $index) {
                <tr>
                    <td>{{$index+1}}</td>
                    <td>{{item.firstName}}  {{item.lastName}}</td>
                  
                    <td>{{item.email}}</td>
                    <td>{{item.contactNo}}</td>
                    <td>{{item.city}}</td>
                    <td>{{item.address}}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" (click)="onEdit(item)">Edit</button>
                        <button class="btn btn-danger btn-sm" (click)="onDelete(item)">Delete</button>
                    </td>
                </tr>
            }
            
        </tbody>
    </table>
</div>

<!-- Employee Modal -->
<div class="modal" #empModal tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalLabel">Add/Edit Employee</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" (click)="closeModel()"></button>
            </div>
            <div class="modal-body">
                <div id="employeeForm">
                    <div class="row">
                        <div class="col-6">
                            <div class="mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" [(ngModel)]="employeeObj.firstName" class="form-control" id="firstName" required>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text"  [(ngModel)]="employeeObj.lastName" class="form-control" id="lastName" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" [(ngModel)]="employeeObj.email" class="form-control" id="email" required>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="mb-3">
                                <label class="form-label">Contact No</label>
                                <input type="text" [(ngModel)]="employeeObj.contactNo" class="form-control" id="contactNo" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <div class="mb-3">
                                <label class="form-label">City</label>
                                <input type="text" [(ngModel)]="employeeObj.city" class="form-control" id="city" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-12">
                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <input type="text" [(ngModel)]="employeeObj.address" class="form-control" id="address" required>
                            </div>
                        </div>
                    </div>
                    
                    @if (employeeObj.employeeid==0) {
                        <button type="button" (click)="onsave()" class="btn btn-primary">Save</button>

                    }@else {
                        <button type="button" (click)="onUpdate()" class="btn btn-warning">update employee</button>

                    }
                    
                    
                   
                </div>


            </div>
        </div>
    </div>
</div>
